<!doctype html><html lang="en"><meta charset="utf-8"><title>Inner Orbit responsive verification</title><style>body{margin:0;background:#0c0714;color:#e8d2b0;font:14px system-ui}header{padding:10px;display:flex;gap:12px;align-items:center}button,select{padding:9px;background:#30203d;color:#ffe0ac;border:1px solid #ac8e63;border-radius:6px}#stage{margin:0 auto;overflow:hidden}iframe{border:0;display:block;transform-origin:top left}</style><header><label>Viewport <select id="width"><option>390</option><option>768</option><option selected>1440</option><option>2560</option><option>360</option></select></label><label>Destination <select id="route"><option>discover</option><option>home</option><option>observatory</option><option>numerology</option><option>blueprint</option><option>resonance</option><option>journey</option><option>cycles</option><option>connections</option><option>starforge</option><option>alchemy</option><option>access</option><option>directory</option></select></label><button id="apply">Render viewport</button><span id="dimensions"></span></header><div id="stage"><iframe title="Responsive preview" id="preview"></iframe></div><script>function show(){let w=+document.querySelector('#width').value,h=w<600?1050:1000,s=Math.min(1,(innerWidth-24)/w,(innerHeight-70)/h);let f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+s+')';document.querySelector('#stage').style.width=w*s+'px';document.querySelector('#stage').style.height=h*s+'px';f.src='./index.html#'+document.querySelector('#route').value;document.querySelector('#dimensions').textContent=w+' × '+h+' CSS pixels'}document.querySelector('#apply').onclick=show;show();</script></html>
